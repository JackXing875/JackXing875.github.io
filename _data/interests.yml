- title: Efficient Multimodal Reasoning
  description: Investigating how vision–language models retain and use visual evidence during multi-step reasoning, with a focus on visual information flow and efficient inference through KV cache optimization, token pruning, and sparse attention.
- title: Video Generation &amp; Post-Training
  description: Exploring temporally coherent video generation through efficient memory and feature reuse, alongside post-training methods based on reinforcement learning and preference alignment to improve visual quality and prompt adherence.
