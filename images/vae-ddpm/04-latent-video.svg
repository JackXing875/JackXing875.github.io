<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc"><title id="title">潜空间视频：表示压缩与去噪生成分成两层</title><desc id="desc">上层展示视频通过编码器变成干净潜表示，再由解码器重建。下层展示潜空间噪声经过反向过程得到干净潜表示。右下说明视频时间和去噪时间是两个不同的轴。</desc><defs><marker id="007f82" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#007f82"/></marker><marker id="225bd0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#225bd0"/></marker><marker id="b75522" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#b75522"/></marker><marker id="52657a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#52657a"/></marker></defs><rect width="1000" height="660" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="45" y="50" fill="#10243a" font-size="29" text-anchor="start" font-weight="700">潜空间视频：表示压缩与去噪生成分成两层</text><text x="45" y="92" fill="#52657a" font-size="19" text-anchor="start" font-weight="400">表示层：学习保留哪些时空信息</text><rect x="45" y="120" width="160" height="110" rx="15" fill="#e8efff" stroke="#ced8e2" stroke-width="1.5"/><text x="125.0" y="163" fill="#10243a" font-size="21" text-anchor="middle" font-weight="600">视频 x</text><text x="125.0" y="204" fill="#52657a" font-size="17" text-anchor="middle" font-weight="400">多个帧位置 f</text><rect x="270" y="120" width="175" height="110" rx="15" fill="#e5f3f3" stroke="#ced8e2" stroke-width="1.5"/><text x="357.5" y="163" fill="#10243a" font-size="21" text-anchor="middle" font-weight="600">编码器 E</text><text x="357.5" y="204" fill="#52657a" font-size="17" text-anchor="middle" font-weight="400">时空压缩</text><rect x="510" y="120" width="165" height="110" rx="15" fill="#fff0e5" stroke="#ced8e2" stroke-width="1.5"/><text x="592.5" y="163" fill="#10243a" font-size="21" text-anchor="middle" font-weight="600">干净潜表示 z₀</text><text x="592.5" y="204" fill="#52657a" font-size="17" text-anchor="middle" font-weight="400">紧凑张量</text><rect x="740" y="120" width="215" height="110" rx="15" fill="#e5f3f3" stroke="#ced8e2" stroke-width="1.5"/><text x="847.5" y="163" fill="#10243a" font-size="21" text-anchor="middle" font-weight="600">解码器 D</text><text x="847.5" y="204" fill="#52657a" font-size="17" text-anchor="middle" font-weight="400">输出 / 重建视频</text><path d="M 207 174 L 264 174" fill="none" stroke="#007f82" stroke-width="3" marker-end="url(#007f82)"/><path d="M 447 174 L 504 174" fill="none" stroke="#007f82" stroke-width="3" marker-end="url(#007f82)"/><path d="M 677 174 L 734 174" fill="none" stroke="#007f82" stroke-width="3" marker-end="url(#007f82)"/><text x="45" y="293" fill="#52657a" font-size="19" text-anchor="start" font-weight="400">生成层：学习干净潜表示的分布</text><rect x="45" y="320" width="175" height="110" rx="15" fill="#e8efff" stroke="#ced8e2" stroke-width="1.5"/><text x="132.5" y="363" fill="#10243a" font-size="22" text-anchor="middle" font-weight="600">潜噪声 zK</text><text x="132.5" y="403" fill="#52657a" font-size="19" text-anchor="middle" font-weight="400">简单起点分布</text><rect x="295" y="320" width="350" height="110" rx="15" fill="#fff0e5" stroke="#ced8e2" stroke-width="1.5"/><text x="470.0" y="363" fill="#10243a" font-size="22" text-anchor="middle" font-weight="600">潜空间反向生成</text><text x="470.0" y="403" fill="#52657a" font-size="19" text-anchor="middle" font-weight="400">zK → … → z₁ → z₀</text><rect x="720" y="320" width="235" height="110" rx="15" fill="#e5f3f3" stroke="#ced8e2" stroke-width="1.5"/><text x="837.5" y="363" fill="#10243a" font-size="22" text-anchor="middle" font-weight="600">同一个解码器 D</text><text x="837.5" y="403" fill="#52657a" font-size="19" text-anchor="middle" font-weight="400">生成新视频</text><path d="M 222 375 L 289 375" fill="none" stroke="#b75522" stroke-width="3" marker-end="url(#b75522)"/><path d="M 647 375 L 714 375" fill="none" stroke="#b75522" stroke-width="3" marker-end="url(#b75522)"/><rect x="45" y="475" width="910" height="139" rx="15" fill="#fff" stroke="#ced8e2" stroke-width="1.5"/><text x="75" y="514" fill="#10243a" font-size="22" text-anchor="start" font-weight="600">两种时间</text><text x="75" y="554" fill="#10243a" font-size="20" text-anchor="start" font-weight="400">f：视频中的帧 / 潜时间位置</text><text x="75" y="588" fill="#10243a" font-size="20" text-anchor="start" font-weight="400">k：整段视频状态的去噪步骤</text><rect x="650" y="493" width="39" height="23" rx="4" fill="#b5dadd" stroke="#ced8e2" stroke-width="1.5"/><rect x="697" y="493" width="39" height="23" rx="4" fill="#b5dadd" stroke="#ced8e2" stroke-width="1.5"/><rect x="744" y="493" width="39" height="23" rx="4" fill="#b5dadd" stroke="#ced8e2" stroke-width="1.5"/><rect x="791" y="493" width="39" height="23" rx="4" fill="#b5dadd" stroke="#ced8e2" stroke-width="1.5"/><rect x="838" y="493" width="39" height="23" rx="4" fill="#b5dadd" stroke="#ced8e2" stroke-width="1.5"/><rect x="650" y="524" width="39" height="23" rx="4" fill="#8fc5c9" stroke="#ced8e2" stroke-width="1.5"/><rect x="697" y="524" width="39" height="23" rx="4" fill="#8fc5c9" stroke="#ced8e2" stroke-width="1.5"/><rect x="744" y="524" width="39" height="23" rx="4" fill="#8fc5c9" stroke="#ced8e2" stroke-width="1.5"/><rect x="791" y="524" width="39" height="23" rx="4" fill="#8fc5c9" stroke="#ced8e2" stroke-width="1.5"/><rect x="838" y="524" width="39" height="23" rx="4" fill="#8fc5c9" stroke="#ced8e2" stroke-width="1.5"/><rect x="650" y="555" width="39" height="23" rx="4" fill="#5ba6af" stroke="#ced8e2" stroke-width="1.5"/><rect x="697" y="555" width="39" height="23" rx="4" fill="#5ba6af" stroke="#ced8e2" stroke-width="1.5"/><rect x="744" y="555" width="39" height="23" rx="4" fill="#5ba6af" stroke="#ced8e2" stroke-width="1.5"/><rect x="791" y="555" width="39" height="23" rx="4" fill="#5ba6af" stroke="#ced8e2" stroke-width="1.5"/><rect x="838" y="555" width="39" height="23" rx="4" fill="#5ba6af" stroke="#ced8e2" stroke-width="1.5"/><path d="M 650 595 L 889 595" fill="none" stroke="#007f82" stroke-width="3" marker-end="url(#007f82)"/><text x="900" y="600" fill="#007f82" font-size="18" text-anchor="middle" font-weight="400">f</text><path d="M 630 495 L 630 578" fill="none" stroke="#b75522" stroke-width="3" marker-end="url(#b75522)"/><text x="630" y="485" fill="#b75522" font-size="18" text-anchor="middle" font-weight="400">k</text></g></svg>