<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">VAE：训练时推断，生成时采样</title><desc id="desc">上半部分是数据经过编码器、随机潜变量、解码器得到观测分布的训练路径。下半部分显示从固定先验开始的生成路径。</desc><defs><marker id="007f82" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#007f82"/></marker><marker id="225bd0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#225bd0"/></marker><marker id="b75522" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#b75522"/></marker><marker id="52657a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#52657a"/></marker></defs><rect width="1000" height="560" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="45" y="50" fill="#10243a" font-size="29" text-anchor="start" font-weight="700">VAE：训练时推断，生成时采样</text><text x="45" y="95" fill="#52657a" font-size="19" text-anchor="start" font-weight="400">训练：编码器和解码器一起更新</text><rect x="45" y="125" width="130" height="115" rx="15" fill="#e5f3f3" stroke="#ced8e2" stroke-width="1.5"/><text x="110.0" y="170" fill="#10243a" font-size="23" text-anchor="middle" font-weight="600">观测 x</text><text x="110.0" y="209" fill="#52657a" font-size="18" text-anchor="middle" font-weight="400">固定数据</text><rect x="225" y="125" width="215" height="115" rx="15" fill="#e8efff" stroke="#ced8e2" stroke-width="1.5"/><text x="332.5" y="170" fill="#10243a" font-size="23" text-anchor="middle" font-weight="600">编码器 qφ</text><text x="332.5" y="209" fill="#52657a" font-size="18" text-anchor="middle" font-weight="400">输出 μ 和 log σ²</text><rect x="490" y="125" width="170" height="115" rx="15" fill="#fff0e5" stroke="#ced8e2" stroke-width="1.5"/><text x="575.0" y="170" fill="#10243a" font-size="23" text-anchor="middle" font-weight="600">潜样本 z</text><text x="575.0" y="209" fill="#52657a" font-size="18" text-anchor="middle" font-weight="400">μ + σ ⊙ ε</text><rect x="710" y="125" width="245" height="115" rx="15" fill="#e5f3f3" stroke="#ced8e2" stroke-width="1.5"/><text x="832.5" y="170" fill="#10243a" font-size="23" text-anchor="middle" font-weight="600">解码器 pθ</text><text x="832.5" y="209" fill="#52657a" font-size="18" text-anchor="middle" font-weight="400">输出观测分布参数</text><path d="M 177 181 L 219 181" fill="none" stroke="#007f82" stroke-width="3" marker-end="url(#007f82)"/><path d="M 442 181 L 484 181" fill="none" stroke="#007f82" stroke-width="3" marker-end="url(#007f82)"/><path d="M 662 181 L 704 181" fill="none" stroke="#007f82" stroke-width="3" marker-end="url(#007f82)"/><text x="575" y="93" fill="#b75522" font-size="18" text-anchor="middle" font-weight="400">ε ~ N(0, I)</text><path d="M 575 117 L 575 125" fill="none" stroke="#b75522" stroke-width="3" marker-end="url(#b75522)"/><rect x="225" y="275" width="315" height="64" rx="15" fill="#ffffff" stroke="#ced8e2" stroke-width="1.5"/><text x="382" y="316" fill="#10243a" font-size="19" text-anchor="middle" font-weight="400">KL：qφ(z | x) 与先验的差异</text><rect x="570" y="275" width="385" height="64" rx="15" fill="#ffffff" stroke="#ced8e2" stroke-width="1.5"/><text x="762" y="316" fill="#10243a" font-size="21" text-anchor="middle" font-weight="400">重构项：− log pθ(x | z)</text><text x="45" y="386" fill="#52657a" font-size="19" text-anchor="start" font-weight="400">生成：从先验开始，不需要输入图像</text><rect x="45" y="410" width="200" height="105" rx="15" fill="#fff0e5" stroke="#ced8e2" stroke-width="1.5"/><text x="145.0" y="452" fill="#10243a" font-size="21" text-anchor="middle" font-weight="600">固定先验 p(z)</text><text x="145.0" y="487" fill="#52657a" font-size="18" text-anchor="middle" font-weight="400">N(0, I)</text><rect x="320" y="410" width="150" height="105" rx="15" fill="#fff0e5" stroke="#ced8e2" stroke-width="1.5"/><text x="395.0" y="452" fill="#10243a" font-size="21" text-anchor="middle" font-weight="600">采样 z</text><text x="395.0" y="487" fill="#52657a" font-size="18" text-anchor="middle" font-weight="400">新随机样本</text><rect x="545" y="410" width="235" height="105" rx="15" fill="#e5f3f3" stroke="#ced8e2" stroke-width="1.5"/><text x="662.5" y="452" fill="#10243a" font-size="21" text-anchor="middle" font-weight="600">解码器 pθ</text><text x="662.5" y="487" fill="#52657a" font-size="18" text-anchor="middle" font-weight="400">条件观测分布</text><rect x="855" y="410" width="100" height="105" rx="15" fill="#e8efff" stroke="#ced8e2" stroke-width="1.5"/><text x="905.0" y="452" fill="#10243a" font-size="21" text-anchor="middle" font-weight="600">样本 x</text><text x="905.0" y="487" fill="#52657a" font-size="18" text-anchor="middle" font-weight="400">新数据</text><path d="M 247 462 L 314 462" fill="none" stroke="#b75522" stroke-width="3" marker-end="url(#b75522)"/><path d="M 472 462 L 539 462" fill="none" stroke="#b75522" stroke-width="3" marker-end="url(#b75522)"/><path d="M 782 462 L 849 462" fill="none" stroke="#b75522" stroke-width="3" marker-end="url(#b75522)"/></g></svg>