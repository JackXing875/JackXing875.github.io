<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 585" role="img" aria-labelledby="title desc"><title id="title">DDPM 的概率账本：三个部分，一次参数化</title><desc id="desc">负变分下界分成终点先验KL、中间反向高斯KL和最终观测负对数似然。固定反向方差时，中间项等价于带时间权重的噪声平方误差。</desc><defs><marker id="007f82" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#007f82"/></marker><marker id="225bd0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#225bd0"/></marker><marker id="b75522" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#b75522"/></marker><marker id="52657a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#52657a"/></marker></defs><rect width="1000" height="585" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="45" y="50" fill="#10243a" font-size="29" text-anchor="start" font-weight="700">DDPM 的概率账本：三个部分，一次参数化</text><rect x="45" y="105" width="270" height="160" rx="15" fill="#e8efff" stroke="#ced8e2" stroke-width="1.5"/><text x="180" y="146" fill="#10243a" font-size="24" text-anchor="middle" font-weight="600">终点项 LT</text><text x="180" y="190" fill="#10243a" font-size="17" text-anchor="middle" font-weight="400">q(xT | x₀) 对齐 p(xT)</text><text x="180" y="232" fill="#52657a" font-size="18" text-anchor="middle" font-weight="400">固定日程时不训练 θ</text><rect x="365" y="105" width="270" height="160" rx="15" fill="#e5f3f3" stroke="#ced8e2" stroke-width="1.5"/><text x="500" y="146" fill="#10243a" font-size="24" text-anchor="middle" font-weight="600">中间项 Σ Lt−1</text><text x="500" y="190" fill="#10243a" font-size="17" text-anchor="middle" font-weight="400">q(xₜ₋₁ | xₜ, x₀) 对齐 pθ</text><text x="500" y="232" fill="#52657a" font-size="18" text-anchor="middle" font-weight="400">t = 2, …, T</text><rect x="685" y="105" width="270" height="160" rx="15" fill="#fff0e5" stroke="#ced8e2" stroke-width="1.5"/><text x="820" y="146" fill="#10243a" font-size="24" text-anchor="middle" font-weight="600">观测项 L₀</text><text x="820" y="190" fill="#10243a" font-size="17" text-anchor="middle" font-weight="400">− log pθ(x₀ | x₁)</text><text x="820" y="232" fill="#52657a" font-size="18" text-anchor="middle" font-weight="400">最后一步单独建模</text><text x="340" y="193" fill="#10243a" font-size="27" text-anchor="middle" font-weight="400">+</text><text x="660" y="193" fill="#10243a" font-size="27" text-anchor="middle" font-weight="400">+</text><path d="M 500 268 L 500 311" fill="none" stroke="#007f82" stroke-width="3" marker-end="url(#007f82)"/><rect x="245" y="321" width="510" height="60" rx="15" fill="#fff" stroke="#ced8e2" stroke-width="1.5"/><text x="500" y="359" fill="#10243a" font-size="21" text-anchor="middle" font-weight="400">固定 σₜ²：高斯 KL → 均值平方误差</text><path d="M 500 383 L 500 410" fill="none" stroke="#007f82" stroke-width="3" marker-end="url(#007f82)"/><rect x="245" y="420" width="510" height="60" rx="15" fill="#e5f3f3" stroke="#ced8e2" stroke-width="1.5"/><text x="500" y="458" fill="#10243a" font-size="21" text-anchor="middle" font-weight="400">噪声参数化 → wt · ‖ε − εθ‖² + 常数</text><text x="500" y="530" fill="#b75522" font-size="21" text-anchor="middle" font-weight="600">Lsimple 去掉不同时间的相对权重：这是目标重加权</text><text x="500" y="561" fill="#52657a" font-size="17" text-anchor="middle" font-weight="400">“不依赖参数”不等于“不同任务的权重可以任意删除”。</text></g></svg>